<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装 签名工坊 v3</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0b0d12;color:#e7ecf3;font:16px/1.6 -apple-system,"PingFang SC",sans-serif;padding:20px}
.card{width:min(430px,92vw);background:#141821;border:1px solid #232a38;border-radius:22px;padding:28px;text-align:center}
.icon{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(59,130,246,.35)}
h1{font-size:21px;margin:0 0 4px}
.meta{color:#8b98ad;font-size:12.5px;margin:0 0 20px}
a.btn{display:block;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;text-decoration:none;
padding:15px;border-radius:14px;font-weight:650;font-size:16px}
.feat{margin-top:18px;text-align:left;font-size:12.5px;color:#8b98ad;background:#0f131a;
border:1px solid #1e2532;border-radius:12px;padding:14px}
.feat b{color:#c8d6ea;display:block;margin-bottom:8px;font-size:13px}
.feat div{padding:3px 0}
.feat span{color:#6ee7a0}
</style>
<div class="card">
  <div class="icon">🔏</div>
  <h1>签名工坊 v3</h1>
  <div class="meta">9.5 MB · 修了文件选择器</div>
  <a class="btn" href="itms-services://?action=download-manifest&url=https://html.medwarp.cn/ipa/manifest-v3.plist">点击安装</a>
  <div class="feat">
    <b>这版修了 / 加了</b>
    <div><span>✓</span> 修：文件选择器里所有文件置灰点不动（.data 改 .item）</div>
    <div><span>✓</span> 证书详情页：41 项 entitlements 可展开查看</div>
    <div><span>✓</span> 「设为当前证书」按钮</div>
    <div><span>✓</span> 证书左滑：重命名 / 检查 / 删除</div>
    <div><span>✓</span> 检查：剩余天数、白名单数、entitlements 数、密码状态</div>
    <div><span>✓</span> 设置页：存储占用统计、设备标识、电池机型</div>
    <div><span>✓</span> 包内自更新：检查更新 → 触发 OTA 覆盖安装</div>
  </div>
</div>
