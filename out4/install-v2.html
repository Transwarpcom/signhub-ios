<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装 签名工坊 v2</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0b0d12;color:#e7ecf3;font:16px/1.6 -apple-system,"PingFang SC",sans-serif;padding:20px}
.card{width:min(430px,92vw);background:#141821;border:1px solid #232a38;border-radius:22px;padding:28px;text-align:center}
.icon{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);

h1{font-size:21px;margin:0 0 4px}
.meta{color:#8b98ad;font-size:12.5px;margin:0 0 20px}
a.btn{display:block;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;text-decoration:none;
padding:15px;border-radius:14px;font-weight:650;font-size:16px}
.feat{margin-top:18px;text-align:left;font-size:12.5px;color:#8b98ad;background:#0f131a;
border:1px solid #1e2532;border-radius:12px;padding:14px}
.feat b{color:#c8d6ea;display:block;margin-bottom:8px;font-size:13px}
.feat div{padding:3px 0}
.feat span{color:#6ee7a0}

<div class="card">
  <div class="icon">🔏</div>
  <h1>签名工坊 v2</h1>
  <div class="meta">9.1 MB · 五个 tab · 证书持久化</div>
  <a class="btn" href="itms-services://?action=download-manifest&url=https://html.medwarp.cn/ipa/manifest-v2.plist">点击安装</a>
  <div class="feat">
    <b>这版新增</b>
    <div><span>✓</span> 证书库：导入一次长期保存，含 TeamID / AppID / 到期 / 吊销状态</div>
    <div><span>✓</span> IPA 列表：包名、版本、最低 iOS、文件数、解压大小、URLScheme</div>

    <div><span>✓</span> 动态库：导入 .dylib 保存，签名时勾选注入</div>
    <div><span>✓</span> 签名配置：改名 / Bundle ID / 版本 / 最低 iOS / 多开 1-10 份</div>
    <div><span>✓</span> 高级：移除插件、移除 Watch、清旧 _CodeSignature</div>

  </div>
