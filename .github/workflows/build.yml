name: Build SignHub IPA

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch OpenSSL xcframework
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/openssl.zip \
            https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.5000/OpenSSL.xcframework.zip
          unzip -q -o /tmp/openssl.zip -d /tmp/openssl

      - name: Build zsign static lib
        run: |
          set -e
          OSSL=/tmp/openssl/OpenSSL.xcframework/ios-arm64/OpenSSL.framework
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
          SRC=/tmp/zsign/src
          mkdir -p /tmp/obj /tmp/inc
          ln -sfn "$OSSL/Headers" /tmp/inc/openssl

          CXX="xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 -std=c++11 -O2 -fno-rtti"

          # 用宏把 main 改名，避免和 App 的 main 冲突
          echo "=== zsign.cpp 里的 main ==="
          grep -nE "int +main *\(" "$SRC/zsign.cpp" | head -3
          $CXX -Dmain=zsign_run_main -c "$SRC/zsign.cpp" -I "$SRC" -I "$SRC/common" -I "$SRC/third-party/zlib" -I /tmp/inc -o /tmp/obj/zsign_entry.o
          echo "=== zsign_entry.o 符号 ==="
          nm -g /tmp/obj/zsign_entry.o 2>/dev/null | grep -i "main" | head -5

          for f in "$SRC"/*.cpp; do
            [ "$(basename "$f")" = "zsign.cpp" ] && continue
            $CXX -c "$f" -I "$SRC" -I "$SRC/common" -I "$SRC/third-party/zlib" -I /tmp/inc -o "/tmp/obj/$(basename "$f" .cpp).o"
          done

          for f in "$SRC"/common/*.cpp; do
            $CXX -c "$f" -I "$SRC" -I "$SRC/common" -I "$SRC/third-party/zlib" -I /tmp/inc -o "/tmp/obj/common_$(basename "$f" .cpp).o"
          done

          CC="xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2"
          for f in "$SRC"/third-party/zlib/*.c; do
            $CC -c "$f" -I "$SRC/third-party/zlib" -o "/tmp/obj/zlib_$(basename "$f" .c).o"
          done

          for f in "$SRC"/third-party/minizip/*.c; do
            base=$(basename "$f")
            case "$base" in iowin32.c|iowin32s.c) continue;; esac
            $CC -c "$f" -I "$SRC/third-party/zlib" -I "$SRC/third-party/minizip" -o "/tmp/obj/minizip_${base%.c}.o"
          done

          libtool -static -o /tmp/libzsign.a /tmp/obj/*.o
          echo "=== libzsign.a 里的 main 符号 ==="
          nm -g /tmp/libzsign.a 2>/dev/null | grep -i "zsign_run_main" | head -3 || echo "NOT FOUND"
          mkdir -p Vendor
          cp /tmp/libzsign.a Vendor/
          cp -R "$OSSL" Vendor/OpenSSL.framework
          # 拷 header 供 swift 桥接
          mkdir -p Vendor/include
          cp -R "$OSSL/Headers/"* Vendor/include/ 2>/dev/null || true
          ls -lh Vendor

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project SignHub.xcodeproj \
            -scheme SignHub \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -200

      - name: Package IPA
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/SignHub.app
          ls -la "$APP" | head -20
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SignHub-unsigned.ipa Payload
          ls -lh SignHub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SignHub-ipa
          path: SignHub-unsigned.ipa
          retention-days: 30
