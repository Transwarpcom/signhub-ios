<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装 签名工坊</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0b0d12;color:#e7ecf3;font:16px/1.6 -apple-system,"PingFang SC",sans-serif;padding:20px}
.card{width:min(420px,92vw);background:#141821;border:1px solid #232a38;border-radius:22px;padding:30px;text-align:center}
.icon{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(59,130,246,.35)}
h1{font-size:21px;margin:0 0 6px}
.meta{color:#8b98ad;font-size:12.5px;margin:0 0 20px;word-break:break-all}
a.btn{display:block;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;text-decoration:none;
padding:15px;border-radius:14px;font-weight:650;font-size:16px}
.tip{margin-top:16px;font-size:12px;color:#6b7789;text-align:left;background:#0f131a;
border:1px solid #1e2532;border-radius:12px;padding:12px}
</style>
<div class="card">
  <div class="icon">🔏</div>
  <h1>签名工坊</h1>
  <div class="meta">cn.medwarp.signhub · 1.0.0<br>1.0 MB · 已补 AppIcon</div>
  <a class="btn" href="itms-services://?action=download-manifest&url=https://html.medwarp.cn/ipa/manifest-icon.plist">点击安装</a>
  <div class="tip">
    这版补了 <b>Assets.car + CFBundleIcons</b>。之前那版的包里一个图标资源都没有，iOS 16+ 会因为缺图标直接拒装——这跟签名无关，SignBox 签也一样会失败。
  </div>
</div>
