name: SignHub
options:
  bundleIdPrefix: cn.medwarp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  SignHub:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.medwarp.signhub
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: SignHub
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SignHub-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor"
        OTHER_LDFLAGS:
          - "-lz"
          - "-lc++"
          - "-force_load"
          - "$(SRCROOT)/Vendor/libzsign.a"
          - "-framework"
          - "OpenSSL"
        CLANG_CXX_LANGUAGE_STANDARD: "c++11"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
