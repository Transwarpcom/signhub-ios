name: SignHub
options:
  bundleIdPrefix: cn.medwarp
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
targets:
  SignHub:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.medwarp.signhub
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: SignHub
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS:
          - "-lz"
          - "-lssl"
          - "-lcrypto"
          - "-lc++"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/zsign-iOS/lib"
          - "$(SRCROOT)/openssl-iOS/lib"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/zsign-iOS/include"
          - "$(SRCROOT)/openssl-iOS/include"
        CLANG_CXX_LANGUAGE_STANDARD: "c++11"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
    preBuildScripts: []
