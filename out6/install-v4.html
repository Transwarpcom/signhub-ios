<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装 签名工坊 v4</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0b0d12;color:#e7ecf3;font:16px/1.6 -apple-system,"PingFang SC",sans-serif;padding:20px}
.card{width:min(430px,92vw);background:#141821;border:1px solid #232a38;border-radius:22px;padding:28px;text-align:center}
.icon{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#10b981,#3b82f6);
display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(16,185,129,.35)}
h1{font-size:21px;margin:0 0 4px}
.meta{color:#8b98ad;font-size:12.5px;margin:0 0 20px}
a.btn{display:block;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;text-decoration:none;
padding:15px;border-radius:14px;font-weight:650;font-size:16px}
.feat{margin-top:18px;text-align:left;font-size:12.5px;color:#8b98ad;background:#0f131a;
border:1px solid #1e2532;border-radius:12px;padding:14px}
.feat b{color:#c8d6ea;display:block;margin-bottom:8px;font-size:13px}
.feat div{padding:3px 0}
.feat span{color:#6ee7a0}
</style>
<div class="card">
  <div class="icon">🔏</div>
  <h1>签名工坊 v4</h1>
  <div class="meta">9.5 MB · 文件选择器重写</div>
  <a class="btn" href="itms-services://?action=download-manifest&url=https://html.medwarp.cn/ipa/manifest-v4.plist">点击安装</a>
  <div class="feat">
    <b>v4 改了什么</b>
    <div><span>✓</span> 文件选择器换成原生 <code>UIDocumentPickerViewController</code></div>
    <div><span>✓</span> 用 <code>asCopy: true</code> 模式，选文件时直接拷进沙盒</div>
    <div><span>✓</span> 彻底不用 SwiftUI 的 <code>fileImporter</code>（它会按 UTI 置灰）</div>
    <div><span>✓</span> 证书 / IPA / 动态库三处全部换掉</div>
  </div>
</div>
